version: '3.8'

services:
  mcp-server:
    build: .
    image: wygiwyh-mcp-server:latest
    container_name: wygiwyh-mcp-server
    ports:
      - "5000:5000"
    environment:
      - WYGIWYH_MCP_API_BASE_URL=${WYGIWYH_MCP_API_BASE_URL}
      - WYGIWYH_MCP_API_AUTH_MODE=${WYGIWYH_MCP_API_AUTH_MODE}
      - WYGIWYH_MCP_API_USERNAME=${WYGIWYH_MCP_API_USERNAME}
      - WYGIWYH_MCP_API_PASSWORD=${WYGIWYH_MCP_API_PASSWORD}
      - WYGIWYH_MCP_API_BEARER_TOKEN=${WYGIWYH_MCP_API_BEARER_TOKEN}
      - WYGIWYH_MCP_AUTHORIZATION_SERVER_URL=${WYGIWYH_MCP_AUTHORIZATION_SERVER_URL}
      - WYGIWYH_MCP_AUTHORIZATION_SERVER_METADATA_URL=${WYGIWYH_MCP_AUTHORIZATION_SERVER_METADATA_URL}
      - WYGIWYH_MCP_OAUTH_INTROSPECTION_URL=${WYGIWYH_MCP_OAUTH_INTROSPECTION_URL}
      - WYGIWYH_MCP_OAUTH_CLIENT_ID=${WYGIWYH_MCP_OAUTH_CLIENT_ID}
      - WYGIWYH_MCP_OAUTH_CLIENT_SECRET=${WYGIWYH_MCP_OAUTH_CLIENT_SECRET}
      - WYGIWYH_MCP_OAUTH_REQUIRED_SCOPES=${WYGIWYH_MCP_OAUTH_REQUIRED_SCOPES}
      - WYGIWYH_MCP_PUBLIC_BASE_URL=${WYGIWYH_MCP_PUBLIC_BASE_URL}
      - WYGIWYH_MCP_OAUTH_METADATA_TTL_SECONDS=${WYGIWYH_MCP_OAUTH_METADATA_TTL_SECONDS}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
